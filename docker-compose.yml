version: '3.8'

services:
  backend:
    build: ./backend
    container_name: lungscan-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - uploads_data:/app/uploads
    environment:
      - MODEL_PATH=/app/models/model.pth
      - DEVICE=cpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: lungscan-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
